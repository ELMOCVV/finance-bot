# FinanceAI Bot — Railway конфігурація
#
# Railway читає тільки кореневий railway.toml, тож усі сервіси одного
# репозиторію стартують через спільний start.sh, який вибирає процес
# за змінною середовища SERVICE_TYPE:
#
#   Сервіс «api» (SERVICE_TYPE не задано / будь-яке інше значення):
#     Health Check:  /health
#     Env vars:      TELEGRAM_BOT_TOKEN, ANTHROPIC_API_KEY, DATABASE_URL,
#                    WEBHOOK_URL, CORS_ORIGINS
#
#   Сервіс «money-deck-advisor» (SERVICE_TYPE=advisor):
#     Health Check:  (вимкнути — worker-процес без HTTP)
#     Env vars:      ADVISOR_BOT_TOKEN, ANTHROPIC_API_KEY, DATABASE_URL
#
# (Окремий «bot»-сервіс webhook-режиму запускається через python bot/main.py
#  — налаштуйте його startCommand вручну в Railway dashboard за потреби.)

[build]
builder = "NIXPACKS"

[deploy]
startCommand = "bash start.sh"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
